root = "../.."
tmp_dir = "apps/farm-service/tmp"

[build]
  bin = "./apps/farm-service/tmp/main"
  cmd = "go build -o ./apps/farm-service/tmp/main ./apps/farm-service/cmd/main.go"
  delay = 500
  exclude_dir = ["assets", "tmp", "vendor", "test", "client-app"]
  include_dir = ["apps/farm-service", "pkg", "runtime/farm"]
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
