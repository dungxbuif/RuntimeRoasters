apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: runtime-roasters-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Note: Omit rewrite-target to ensure KrakenD and Identity Proxy receive the full path
spec:
  ingressClassName: nginx
  rules:
    - host: runtimeroasters.production # Replace with actual production domain
      http:
        paths:
          # 1. API Gateway (KrakenD)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: krakend-service
                port:
                  number: 8081

          # 2. Identity Proxy (Nginx JWKS Gatekeeper)
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: identity-proxy-service
                port:
                  number: 4434

          # 3. Frontend Client App
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-app-service
                port:
                  number: 3000
