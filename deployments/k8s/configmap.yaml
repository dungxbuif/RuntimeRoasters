apiVersion: v1
kind: ConfigMap
metadata:
  name: runtimeroasters-config
  labels:
    app: runtimeroasters
data:
  # Base Configurations (Non-Sensitive)
  APP_ENV: "production"
  LOG_LEVEL: "info"
  APP_PORT: "8080"
  GRPC_PORT: "9090"

  # Infrastructure URLs (Internal DNS)
  KAFKA_BROKERS: "rr-kafka:9092"
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  VALKEY_ADDR: "valkey-service:6379"

  # Inter-Service Communication URLs
  RETAIL_SERVICE_URL: "http://retail-service:8080"
  LOGISTICS_SERVICE_URL: "http://logistics-service:8080"
