syntax = "proto3";

package runtime.auth.v1;

option go_package = "RuntimeRoasters/runtime/auth/v1;authv1";

import "google/api/annotations.proto";

service AuthService {
  // GetFullSnapshot returns all policies for a given service
  rpc GetFullSnapshot(GetFullSnapshotRequest) returns (GetFullSnapshotResponse) {
    option (google.api.http) = {
      get: "/v1/auth/snapshot/{service_name}"
    };
  }

  // AcceptLogin processes the login acceptance from Ory Kratos/Hydra
  rpc AcceptLogin(AcceptLoginRequest) returns (AcceptLoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login/accept"
      body: "*"
    };
  }

  // User Management
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
  }
  
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users"
    };
  }

  // Get current user info based on context token
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option (google.api.http) = {
      get: "/v1/auth/me"
    };
  }

  // System Bootstrap & Status
  rpc SeedSystem(SeedSystemRequest) returns (SeedSystemResponse) {
    option (google.api.http) = {
      post: "/v1/auth/seed"
      body: "*"
    };
  }

  rpc GetSystemStatus(GetSystemStatusRequest) returns (GetSystemStatusResponse) {
    option (google.api.http) = {
      get: "/v1/auth/system/status"
    };
  }

  // Self-service logout and revoke all access tokens for the authenticated subject
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
  }

  // Administrative revoke all access tokens for a specific subject
  rpc AdminRevokeAll(AdminRevokeAllRequest) returns (AdminRevokeAllResponse) {
    option (google.api.http) = {
      post: "/v1/admin/users/{subject}/security/revoke-all"
      body: "*"
    };
  }

  // Internal endpoint to get the token validity boundary for a subject.
  // Not exposed via gRPC-Gateway.
  rpc GetTokenValidityBoundary(GetTokenValidityBoundaryRequest) returns (GetTokenValidityBoundaryResponse);
}

message GetFullSnapshotRequest {
  string service_name = 1;
}

message GetFullSnapshotResponse {
  repeated string policies = 1; // CSV formatted lines: p, role, obj, act
}

message AcceptLoginRequest {
  string login_challenge = 1;
  string subject = 2;
  bool remember = 3;
  int64 remember_for = 4;
}

message AcceptLoginResponse {
  string redirect_to = 1;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  string role = 4;
}

message CreateUserRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  string role = 4;
}

message CreateUserResponse {
  User user = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
}

message SeedSystemRequest {
  bool force = 1;
}

message SeedSystemResponse {
  bool success = 1;
  string message = 2;
}

message GetSystemStatusRequest {}

message GetSystemStatusResponse {
  bool all_seeded = 1;
  map<string, bool> services_status = 2;
}

message LogoutRequest {
  string reason = 1;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

message AdminRevokeAllRequest {
  string subject = 1;
  string reason = 2;
}

message AdminRevokeAllResponse {
  string subject = 1;
  string tokens_valid_after = 2; // RFC3339 formatted string
  int64 version = 3;
}

message GetTokenValidityBoundaryRequest {
  string subject = 1;
}

message GetTokenValidityBoundaryResponse {
  string subject = 1;
  string tokens_valid_after = 2; // RFC3339 formatted string
}
