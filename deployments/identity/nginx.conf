# ===========================================================================
# JWKS Gatekeeper — Nginx Reverse Proxy for Ory Hydra Public Port
#
# Vai trò:
#   - Port 4434: Proxy đến Hydra Public API (bảo vệ JWKS).
#   - Các port khác: Pass-through đến Hydra/Kratos tương ứng.
# ===========================================================================

# --- Admin Port: Hydra Public Proxy + JWKS Gatekeeper ---
server {
    listen 4434;
    server_name _;

    # JWKS endpoint — chỉ cho phép internal services có đúng header
    location = /.well-known/jwks.json {
        if ($http_x_internal_secret != "${INTERNAL_SECRET}") {
            return 401 '{"error":"unauthorized","message":"Missing or invalid X-Internal-Secret header"}';
        }

        add_header Content-Type application/json;
        proxy_pass http://hydra:4444;
        proxy_set_header Host $host;
    }

    # OpenID Configuration
    location = /.well-known/openid-configuration {
        proxy_pass http://hydra:4444;
        proxy_set_header Host $host;
    }

    # Health endpoint
    location /health {
        proxy_pass http://hydra:4444;
        proxy_set_header Host $host;
    }

    # Kratos Admin API
    location /admin/ {
        if ($http_x_internal_secret != "${INTERNAL_SECRET}") {
            return 401 '{"error":"unauthorized","message":"Missing or invalid X-Internal-Secret header"}';
        }
        proxy_pass http://kratos:4434;
        proxy_set_header Host $host;
    }

    location / {
        return 403 '{"error":"forbidden","message":"Public Proxy is only for JWKS and Metadata"}';
    }
}

# --- Kratos Public (pass-through) ---
server {
    listen 4433;
    location / {
        proxy_pass http://kratos:4433;
        proxy_set_header Host $host;
    }
}
