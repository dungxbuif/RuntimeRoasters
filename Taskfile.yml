version: '3'

vars:
  PG_USER: user
  PG_DB_HOST: localhost
  PG_DB_PORT: 54321
  PG_CONTAINER: rr-postgres

tasks:
  infra:
    desc: Start infrastructure containers
    cmds:
      - docker compose -f deployments/docker-compose.dev.yaml up -d

  env:reset:
    desc: Full reset of the environment (Clear data, restart containers, run migrations)
    cmds:
      - ./scripts/reset-env.sh

  # --- Migrations (Schema + Seed) Orchestration ---
  migrate:all:
    desc: Run all migrations and seeds for all services
    cmds:
      - task: logistics:migrate
      - task: retail:migrate
      - task: warehouse:migrate
      - task: farm:migrate
      - task: audit:migrate
      - task: trace:migrate
      - task: payment:migrate

  # --- Individual Service Migrations ---
  
  logistics:migrate:
    cmds: ["docker exec -i {{.PG_CONTAINER}} psql -U {{.PG_USER}} -d logistics_db < src/apps/logistics-service/migrations/000001_create_logistics_tables.up.sql"]
  retail:migrate:
    cmds: ["docker exec -i {{.PG_CONTAINER}} psql -U {{.PG_USER}} -d retail_db < src/apps/retail-service/migrations/000001_init.up.sql"]
  warehouse:migrate:
    cmds: ["docker exec -i {{.PG_CONTAINER}} psql -U {{.PG_USER}} -d warehouse_db < src/apps/warehouse-service/migrations/000001_init.up.sql"]
  farm:migrate:
    cmds:
      - "docker exec -i {{.PG_CONTAINER}} psql -U {{.PG_USER}} -d farm_db < src/apps/farm-service/migrations/000001_create_farms_table.up.sql"
      - "docker exec -i {{.PG_CONTAINER}} psql -U {{.PG_USER}} -d farm_db < src/apps/farm-service/migrations/000002_create_outbox_events_table.up.sql"
      - "docker exec -i {{.PG_CONTAINER}} psql -U {{.PG_USER}} -d farm_db < src/apps/farm-service/migrations/000003_create_harvests_table.up.sql"
  payment:migrate:
    cmds: ["docker exec -i {{.PG_CONTAINER}} psql -U {{.PG_USER}} -d payment_db < src/apps/payment-service/migrations/000001_init.up.sql"]
  audit:migrate:
    cmds: ["docker exec -i {{.PG_CONTAINER}} psql -U {{.PG_USER}} -d audit_db < src/apps/audit-service/migrations/000001_init.up.sql"]
  trace:migrate:
    cmds: ["docker exec -i {{.PG_CONTAINER}} psql -U {{.PG_USER}} -d trace_db < src/apps/trace-service/migrations/000001_init.up.sql"]

  # --- Infrastructure Seeding ---
  seed:infra:
    desc: Seed Admin User & OAuth2 Client (Kratos/Hydra)
    cmds:
      - docker compose -f deployments/docker-compose.dev.yaml up seeder

  seed:demo:
    desc: Run dynamic Ultra-Rich Farm-to-Cup simulation seeder directly into DB, ES, and Cassandra
    cmds:
      - go run src/scripts/seed_demo/main.go

  be:
    desc: Start all backend services with hot-reload (Air)
    cmds:
      - |
        trap 'kill 0' EXIT;
        (cd src/apps/auth-service && air) &
        (cd src/apps/farm-service && air) &
        (cd src/apps/retail-service && air) &
        (cd src/apps/warehouse-service && air) &
        (cd src/apps/logistics-service && air) &
        (cd src/apps/payment-service && air) &
        (cd src/apps/audit-service && air) &
        (cd src/apps/trace-service && air) &
        (cd src/apps/socket-service && air) &
        wait

  fe:
    desc: Start Frontend Client App
    dir: src/apps/client-app
    cmds:
      - npm run dev

  all:
    desc: Start full stack (BE + FE)
    cmds:
      - |
        trap 'kill 0' EXIT;
        task be &
        task fe &
        wait

  auth:
    dir: src/apps/auth-service
    cmds: [air]
  farm:
    dir: src/apps/farm-service
    cmds: [air]
  retail:
    dir: src/apps/retail-service
    cmds: [air]
  warehouse:
    dir: src/apps/warehouse-service
    cmds: [air]
  logistics:
    dir: src/apps/logistics-service
    cmds: [air]
  payment:
    dir: src/apps/payment-service
    cmds: [air]
  audit:
    dir: src/apps/audit-service
    cmds: [air]
  trace:
    dir: src/apps/trace-service
    cmds: [air]
  socket:
    dir: src/apps/socket-service
    cmds: [air]

  proto:
    desc: Generate gRPC and Swagger code from Protos
    cmds:
      - cd api && go run github.com/bufbuild/buf/cmd/buf@latest generate

  swagger-export:
    desc: Export KrakenD OpenAPI spec for the Frontend Portal
    cmds:
      - docker run --rm -v "$PWD/deployments/krakend:/etc/krakend" krakend/krakend-ee:2.9 openapi export -c /etc/krakend/krakend.json > src/apps/client-app/public/api-spec.json

  stop:
    desc: Stop all containers and background tasks
    cmds:
      - docker compose -f deployments/docker-compose.dev.yaml down
