version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: rr-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "54321:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rr-network

  redis:
    image: redis:7-alpine
    container_name: rr-redis
    ports:
      - "6379:6379"
    networks:
      - rr-network

  krakend:
    image: devopsfaith/krakend:2
    container_name: rr-krakend
    volumes:
      - ./krakend:/etc/krakend
    ports:
      - "8081:8081"
    networks:
      - rr-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - jaeger

networks:
  rr-network:
    name: rr-network
    driver: bridge

volumes:
  postgres_data:
