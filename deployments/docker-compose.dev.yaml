# ===========================================================================
# RuntimeRoasters — Development Compose File
#
# Mục đích: Dựng toàn bộ hạ tầng Dev trên máy local.
# Tất cả services dùng CHUNG 1 Postgres instance (rr-postgres),
# mỗi service có DB riêng (identity_db, demo_db, ...) được tạo bởi init-db.sql.
#
# Cách chạy:
#   docker compose -f deployments/docker-compose.dev.yaml up -d
#
# Xem log một service:
#   docker compose -f deployments/docker-compose.dev.yaml logs -f kratos
# ===========================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — Shared DB server cho toàn bộ stack
  # init-db.sql tự động tạo tất cả các DB cần thiết khi container khởi động lần đầu.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: rr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres # default db, các DB khác tạo qua init-db.sql
    ports:
      - "54321:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Valkey — Dùng cho: Session Store, Token Blacklist, Idempotency & GPS Tracking
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: rr-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - rr-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Apache Kafka — single-node broker, no ZooKeeper
  # Dùng cho: AuthZ Policy Sync, Token Revocation, Saga Messaging
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.0
    container_name: rr-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094" # External port
    networks:
      - rr-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # Kafka UI — Giao diện quản lý Kafka
  # Truy cập: http://localhost:8090
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rr-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - rr-network

  # ---------------------------------------------------------------------------
  # Elasticsearch — CQRS read model/search backend for Trace Service
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: rr-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - rr-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # ---------------------------------------------------------------------------
  # Kibana — Local Elasticsearch inspection UI
  # Truy cập: http://localhost:5601
  # ---------------------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: rr-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - rr-network

  # ---------------------------------------------------------------------------
  # Cassandra — Immutable audit log storage
  # ---------------------------------------------------------------------------
  cassandra:
    image: cassandra:4.1
    container_name: rr-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: RuntimeRoasters
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 192M
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - rr-network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' 127.0.0.1 9042 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  # ---------------------------------------------------------------------------
  # SigNoz Observability — OpenTelemetry traces/metrics/logs UI
  # Truy cập: http://localhost:3301
  #
  # Note: signoz-zookeeper-1 is used only by ClickHouse/SigNoz coordination.
  # Kafka above remains Apache Kafka without ZooKeeper.
  # ---------------------------------------------------------------------------
  signoz-zookeeper-1:
    image: signoz/zookeeper:3.7.1
    container_name: rr-signoz-zookeeper-1
    restart: unless-stopped
    user: root
    environment:
      ZOO_SERVER_ID: 1
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_AUTOPURGE_INTERVAL: 1
      ZOO_ENABLE_PROMETHEUS_METRICS: "yes"
      ZOO_PROMETHEUS_METRICS_PORT_NUMBER: 9141
    volumes:
      - signoz_zookeeper_data:/bitnami/zookeeper
    networks:
      - rr-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null"]
      interval: 30s
      timeout: 5s
      retries: 5

  signoz-init-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    container_name: rr-signoz-init-clickhouse
    restart: on-failure
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
        chmod +x /var/lib/clickhouse/user_scripts/histogramQuantile
    volumes:
      - signoz_clickhouse_user_scripts:/var/lib/clickhouse/user_scripts
    networks:
      - rr-network

  signoz-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    container_name: rr-signoz-clickhouse
    restart: unless-stopped
    tty: true
    depends_on:
      signoz-init-clickhouse:
        condition: service_completed_successfully
      signoz-zookeeper-1:
        condition: service_healthy
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./signoz/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./signoz/clickhouse/custom-function.xml:/etc/clickhouse-server/custom-function.xml:ro
      - signoz_clickhouse_user_scripts:/var/lib/clickhouse/user_scripts
      - signoz_clickhouse_data:/var/lib/clickhouse
    networks:
      - rr-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q 0.0.0.0:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  signoz:
    image: signoz/signoz:v0.125.1
    container_name: rr-signoz
    restart: unless-stopped
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    environment:
      SIGNOZ_ALERTMANAGER_PROVIDER: signoz
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_SQLSTORE_SQLITE_PATH: /var/lib/signoz/signoz.db
      SIGNOZ_TOKENIZER_JWT_SECRET: dev-signoz-tokenizer-secret
    ports:
      - "3301:8080"
    volumes:
      - signoz_sqlite_data:/var/lib/signoz
    networks:
      - rr-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  signoz-telemetrystore-migrator:
    image: signoz/signoz-otel-collector:v0.144.4
    container_name: rr-signoz-telemetrystore-migrator
    restart: on-failure
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: "true"
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    networks:
      - rr-network

  otel-collector:
    image: signoz/signoz-otel-collector:v0.144.4
    container_name: rr-otel-collector
    restart: unless-stopped
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml
    environment:
      OTEL_RESOURCE_ATTRIBUTES: host.name=runtime-roasters-local,os.type=linux,deployment.environment=development
      LOW_CARDINAL_EXCEPTION_GROUPING: "false"
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: "true"
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      - rr-network

  # ---------------------------------------------------------------------------
  # Ory Kratos — Identity Management
  #
  # Vai trò: Quản lý người dùng, hồ sơ (identities) và đăng nhập (sessions).
  # ---------------------------------------------------------------------------
  kratos-migrate:
    image: oryd/kratos:v1.2.0
    container_name: rr-kratos-migrate
    environment:
      DSN: postgres://user:password@postgres:5432/identity_db?sslmode=disable
    volumes:
      - ./kratos:/etc/config/kratos
    command: migrate sql -e --yes
    networks:
      - rr-network

  kratos:
    image: oryd/kratos:v1.2.0
    container_name: rr-kratos
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://user:password@postgres:5432/identity_db?sslmode=disable&max_conns=20&max_idle_conns=4
    command: serve --config /etc/config/kratos/kratos.yaml --dev
    volumes:
      - ./kratos:/etc/config/kratos
    networks:
      - rr-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://kratos:4433/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Ory Hydra — OAuth2 & OIDC Provider
  #
  # Vai trò: Phát hành JWT (Access Token) và ID Token chuẩn OAuth2/OIDC.
  # ---------------------------------------------------------------------------
  hydra-migrate:
    image: oryd/hydra:v2.2.0
    container_name: rr-hydra-migrate
    environment:
      DSN: postgres://user:password@postgres:5432/hydra_db?sslmode=disable
    command: migrate sql -e --yes
    networks:
      - rr-network

  hydra:
    image: oryd/hydra:v2.2.0
    container_name: rr-hydra
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      hydra-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://user:password@postgres:5432/hydra_db?sslmode=disable
      URLS_SELF_ISSUER: http://localhost:4444/
      URLS_CONSENT: http://localhost:3000/consent
      URLS_LOGIN: http://localhost:3000/login
      SECRETS_SYSTEM: ${INTERNAL_SECRET:-dev-secret-at-least-32-chars-long-!!!!}
      STRATEGIES_ACCESS_TOKEN: jwt
    command: serve all --config /etc/config/hydra/hydra.yaml --dev
    volumes:
      - ./hydra:/etc/config/hydra
    networks:
      - rr-network
    ports:
      - "4444:4444"
      - "4445:4445"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4445/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Identity Proxy (Nginx) — JWKS Gatekeeper
  #
  # Vai trò: Bọc bên ngoài Hydra Public port (4444).
  # Chặn endpoint /.well-known/jwks.json: chỉ cho qua nếu có header đúng.
  # ---------------------------------------------------------------------------
  identity:
    image: nginx:1.27-alpine
    container_name: rr-identity
    restart: unless-stopped
    depends_on:
      hydra:
        condition: service_healthy
      kratos:
        condition: service_healthy
    environment:
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-secret-change-in-production}
    volumes:
      - ./identity/nginx.conf:/etc/nginx/templates/default.conf.template
    ports:
      - "4434:4434" # Hydra Public Proxy (Bảo vệ JWKS)
      - "4433:4433" # Kratos Public
    networks:
      - rr-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4433/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # KrakenD API Gateway
  # ---------------------------------------------------------------------------
  krakend:
    image: krakend:2.9
    container_name: rr-krakend
    restart: unless-stopped
    volumes:
      - ./krakend:/etc/krakend
    ports:
      - "8081:8081"
    networks:
      - rr-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # Seeder — Tự động khởi tạo dữ liệu mẫu
  # ---------------------------------------------------------------------------
  seeder:
    image: oryd/hydra:v2.2.0
    container_name: rr-seeder
    depends_on:
      kratos:
        condition: service_healthy
      hydra:
        condition: service_healthy
    volumes:
      - ./kratos:/etc/config/kratos
      - ./hydra:/etc/config/hydra
    entrypoint: ""
    command: >
      sh -c "
        echo '⏳ Waiting for Kratos & Hydra Admin APIs...';
        while ! wget -qO- http://rr-kratos:4434/admin/identities > /dev/null 2>&1; do sleep 1; done;
        while ! wget -qO- http://rr-hydra:4445/health/ready > /dev/null 2>&1; do sleep 1; done;
        
        echo '👤 Seeding Kratos Admin User...';
        wget -qO- --post-file=/etc/config/kratos/seed-admin.json --header='Content-Type: application/json' http://rr-kratos:4434/admin/identities || echo 'User might already exist';
        
        echo '🔑 Seeding Hydra Client App...';
        hydra import oauth2-client --endpoint http://rr-hydra:4445/ /etc/config/hydra/client-app.json;
        
        echo '✨ Seeding complete!';"
    networks:
      - rr-network

# ===========================================================================
# Networks & Volumes
# ===========================================================================
networks:
  rr-network:
    name: rr-network
    driver: bridge

volumes:
  cassandra_data:
  postgres_data:
  elasticsearch_data:
  signoz_clickhouse_data:
  signoz_clickhouse_user_scripts:
  signoz_sqlite_data:
  signoz_zookeeper_data:
