syntax = "proto3";

package runtime.farm.v1;

option go_package = "github.com/dungxbuif/RuntimeRoasters/runtime/farm/v1;farmv1";

import "google/api/annotations.proto";

// FarmService defines the management of coffee farms.
service FarmService {
  // CreateFarm creates a new farm record.
  rpc CreateFarm(CreateFarmRequest) returns (CreateFarmResponse) {
    option (google.api.http) = {
      post: "/v1/farms"
      body: "*"
    };
  }

  // GetFarm retrieves a single farm by ID.
  rpc GetFarm(GetFarmRequest) returns (GetFarmResponse) {
    option (google.api.http) = {
      get: "/v1/farms/{id}"
    };
  }

  // ListFarms returns all farms owned by the authenticated user.
  rpc ListFarms(ListFarmsRequest) returns (ListFarmsResponse) {
    option (google.api.http) = {
      get: "/v1/farms"
    };
  }

  // UpdateFarm updates an existing farm's details.
  rpc UpdateFarm(UpdateFarmRequest) returns (UpdateFarmResponse) {
    option (google.api.http) = {
      put: "/v1/farms/{id}"
      body: "*"
    };
  }

  // DeleteFarm removes a farm record.
  rpc DeleteFarm(DeleteFarmRequest) returns (DeleteFarmResponse) {
    option (google.api.http) = {
      delete: "/v1/farms/{id}"
    };
  }

  // --- Harvesting Operations ---

  // CreateHarvest records a new harvesting batch.
  rpc CreateHarvest(CreateHarvestRequest) returns (CreateHarvestResponse) {
    option (google.api.http) = {
      post: "/v1/harvests"
      body: "*"
    };
  }

  // GetHarvest retrieves details of a specific harvest batch.
  rpc GetHarvest(GetHarvestRequest) returns (GetHarvestResponse) {
    option (google.api.http) = {
      get: "/v1/harvests/{id}"
    };
  }

  // ListFarmHarvests returns all harvest batches for a specific farm.
  rpc ListFarmHarvests(ListFarmHarvestsRequest) returns (ListFarmHarvestsResponse) {
    option (google.api.http) = {
      get: "/v1/farms/{farm_id}/harvests"
    };
  }
}

// --- Messages ---

message Farm {
  uint64 id = 1;
  string name = 2;
  string location = 3;
  double area = 4;
  string farm_type = 5;
  string owner_id = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message CreateFarmRequest {
  string name = 1;
  string location = 2;
  double area = 3;
  string farm_type = 4;
  string owner_id = 5;
}

message CreateFarmResponse {
  Farm farm = 1;
}

message GetFarmRequest {
  uint64 id = 1;
}

message GetFarmResponse {
  Farm farm = 1;
}

message ListFarmsRequest {}

message ListFarmsResponse {
  repeated Farm farms = 1;
}

message UpdateFarmRequest {
  uint64 id = 1;
  string name = 2;
  string location = 3;
  double area = 4;
  string farm_type = 5;
}

message UpdateFarmResponse {
  Farm farm = 1;
}

message DeleteFarmRequest {
  uint64 id = 1;
}

message DeleteFarmResponse {
  bool success = 1;
}

message Harvest {
  uint64 id = 1;
  uint64 farm_id = 2;
  string owner_id = 3;
  string coffee_type = 4;
  double quantity = 5;
  int64 harvest_date = 6;
  string status = 7;
  string notes = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}

message CreateHarvestRequest {
  uint64 farm_id = 1;
  string coffee_type = 2;
  double quantity = 3;
  string notes = 4;
}

message CreateHarvestResponse {
  Harvest harvest = 1;
}

message GetHarvestRequest {
  uint64 id = 1;
}

message GetHarvestResponse {
  Harvest harvest = 1;
}

message ListFarmHarvestsRequest {
  uint64 farm_id = 1;
}

message ListFarmHarvestsResponse {
  repeated Harvest harvests = 1;
}

