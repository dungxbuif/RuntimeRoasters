run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  exclude-use-default: false
  exclude:
    # Ignore errors related to 'exported func should have comment'
    - should have comment or be unexported
    - should have comment
