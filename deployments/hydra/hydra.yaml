version: v2.2.0

serve:
  public:
    port: 4444
    host: 0.0.0.0
  admin:
    port: 4445
    host: 0.0.0.0

strategies:
  access_token: jwt

ttl:
  login_consent_request: 1h
  access_token: 1h
  refresh_token: 720h
  id_token: 1h
  auth_code: 10m

secrets:
  system:
    - ${INTERNAL_SECRET}

urls:
  login: http://localhost:3000/login
  consent: http://localhost:3000/consent
  self:
    issuer: http://localhost:4444/

log:
  level: info
  format: json
