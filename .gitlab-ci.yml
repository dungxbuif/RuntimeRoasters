workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages: [validate]

default:
  tags: [homelab-rootless]

backend:
  stage: validate
  image: golang:1.27.1-bookworm
  script:
    - go -C src test ./...
    - go -C src vet ./...

client:
  stage: validate
  image: node:22-bookworm-slim
  script:
    - cd src/apps/client-app
    - npm ci
    - npm test
    - npm run build
